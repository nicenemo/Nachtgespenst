[platformio]
; Keep PlatformIO's packages inside the project so `pio` needs no PLATFORMIO_CORE_DIR prefix
; (an env prefix keeps a command inside the Claude Code sandbox; see docs/wiki/claude-code-workflow.md).
core_dir = ${PROJECT_DIR}/.pio/core

[env]
platform = espressif32
framework = arduino

lib_ldf_mode = deep+
lib_compat_mode = off

build_flags = 
    -D USE_NIMBLE
    -D CORE_DEBUG_LEVEL=0
    -std=gnu++17
    -O2
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_KCONFIG_IGNORE
    -I${PROJECT_DIR}/include
build_unflags =
    -std=gnu++11
    -Os
lib_deps = 
    m5stack/M5Unified @ ^0.2.14
    h2zero/NimBLE-Arduino @ ^2.5.0
    fastled/FastLED @ ^3.10.3
    lvgl/lvgl @ ~9.2.2

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

[env:core2]
board = m5stack-core2
build_flags =
    ${env.build_flags}
    -D NG_BOARD_ID=\"C2\"
    -D LED_PIN=25
    -D NG_HAS_LEDBAR=1
    -D NG_HAS_BTNS=1
    -D K_DEVICE_NAME=\"NG-C2\"
    -D NG_PNP_VERSION=0x0202

[env:cores3]
board = m5stack-cores3
; own variant folder: the stock one hard-codes the shared Espressif USB ID 303a:1001 (ADR 0015)
board_build.variants_dir = ${PROJECT_DIR}/variants
build_unflags =
    ${env.build_unflags}
    -DARDUINO_USB_MODE=1
lib_deps =
    ${env.lib_deps}
    FS
build_flags =
    ${env.build_flags}
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
    -DARDUINO_USB_MODE=0
    -D NG_TRANSPORT_USB=1
    -D NG_TRANSPORT_BLE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D NG_BOARD_ID=\"S3\"
    -D NG_HAS_BTNS=0
    -D NG_HAS_LEDBAR=1
    -D LED_PIN=5
    -D K_DEVICE_NAME=\"NG-S3\"
    -D NG_PNP_VERSION=0x0102
    -D USB_MANUFACTURER=\"Nachtgespenst\"
    -D USB_PRODUCT=\"NG-S3\"
    -D USB_SERIAL=\"__MAC__\"
