[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
framework = arduino
lib_ldf_mode = deep+
lib_compat_mode = off

build_flags = 
    -D USE_NIMBLE
    -D CORE_DEBUG_LEVEL=0

lib_deps = 
    m5stack/M5Unified @ ^0.2.14
    h2zero/NimBLE-Arduino @ ^2.5.0
    hijelhub/HijelHID_BLEKeyboard @ ^0.5.0
    fastled/FastLED @ ^3.10.3
# Forced Port Configuration
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
