[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+

build_flags = 
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_CDC_ON_BOOT=0 
    -D ARDUINO_USB_MODE=0

lib_deps =
    m5stack/M5Unified
    h2zero/NimBLE-Arduino
    https://github.com/T-VK/ESP32-BLE-Keyboard.git
