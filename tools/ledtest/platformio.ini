[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
framework = arduino
lib_deps =
    m5stack/M5Unified @ ^0.2.14
    fastled/FastLED @ ^3.10.3
monitor_speed = 115200
build_flags = -D CORE_DEBUG_LEVEL=0
build_src_filter = +<main.cpp>

; CoreS3 pin finder: built-in USB-Serial/JTAG (so esptool auto-reset works again after this sketch).
[env:cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino
lib_deps =
    m5stack/M5Unified @ ^0.2.14
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<main_s3.cpp>
